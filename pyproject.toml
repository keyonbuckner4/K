[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Kalshi event-contract trading system: ladder arbitrage plus independent pricing models, behind one RiskEngine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "websockets>=13,<18",
    "cryptography>=42",
]

[project.scripts]
bot = "kalshi_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
