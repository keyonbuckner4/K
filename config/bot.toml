[strategies.crypto]
enabled = true
mode = "observe"
max_contracts = 5
series = { BTC = "KXBTCD", ETH = "KXETHD" }
# Every other open series starting with these prefixes is traded as that asset, which picks up the
# intraday and hourly BTC/ETH ladders without anyone copying a ticker out of the Kalshi web app.
# Run `uv run bot discover --category crypto` to see exactly what it will adopt.
series_patterns = { BTC = ["KXBTC"], ETH = ["KXETH"] }
spot_source = "kraken"           # public, no key: https://api.kraken.com/0/public/Ticker
vol_source = "deribit_dvol"      # deribit_dvol (30-day implied volatility index) | realized (Kraken candles)
vol_fallback_realized = true     # if Deribit is unreachable, use realized vol and say so in the log and the decision's source
realized_vol_window_hours = 72
# Volatility is matched to the horizon. DVOL is a 30-day implied index, so it is the wrong input for
# a market settling in 15 minutes; below short_horizon_hours the model uses realized vol measured
# over short_window_hours of fine-grained candles instead.
short_horizon_hours = 6
short_window_hours = 12
# Intraday ladders are eligible, but the gate still needs 10 minutes to settlement and 5c of net
# edge after fees. At 50c the taker fee is about 1.75c per contract, so a 15-minute market has to be
# mispriced by nearly 7c gross to be worth taking. Most will not be, and the gate will say so.
min_minutes_to_close = 10

[strategies.economics]
enabled = true
mode = "observe"
max_contracts = 5
# Economic releases have no free live feed to price them from, so this strategy prices only events
# you have written a view for. With discovery on it still finds every open economics event and logs
# each one by name as "no consensus view configured for ...", which is the list of events worth
# writing a view for. Ladder arbitrage covers the same events structurally in the meantime.
categories = ["econom", "inflation", "cpi", "fed", "jobs", "gdp"]
views_path = "config/econ_views.toml"   # your consensus distributions; see config/econ_views.example.toml
